# 밸런스 검사 허용 목록(SD-25 §3): '영역ID|대상': 이유. 정본에서 일부러 벗어났거나, 교전 전체 · 이야기 까닭으로 둔 것만 — 대상 글이 바뀌면 허용도 풀린다(다시 본다).
# --- 2026-10-23 밸런스 첫 전수(조율사 보고 · STAGE_1 '밸런스 첫 전수') ---
"B3|CR-001 잔바퀴 떼 (독일바퀴 변이)(약 · Lv1 · HP 20 · DR 0)": 떼 성향(최대 넷이 함께) — 한 마리는 빨리 쓰러져야 한다
"B3|CR-002 큰바퀴 (이질바퀴 변이)(약 · Lv1 · HP 8 · DR 0)": 원작 방사능바퀴 HP 계승 · 2~7마리 떼로 나온다(무리 전체가 처치 시간)
"B4|CR-004 알집바퀴 (번식 개체) 3명 ↔ Lv4 HP 230 DR 4": 위협은 물기가 아니라 부화(큰바퀴를 낳는다) — 제 몸은 약해야 공략이 선다
"B3|CR-081 왕개미 병정(중 · Lv6 · HP 150 · DR 10)": 목표에서 25% 안 · 여왕방 호위(금탑) — 단단한 쪽이 맞다
"B3|CR-082 왕개미 여왕(전설 · Lv7 · HP 750 · DR 15)": 전설 띠 끝(35.7초) · 원작 압축 HP · 금탑 마지막 방
"B4|CR-095 변이 시궁쥐 1명 ↔ Lv2 HP 210 DR 4": 목표에서 25% 안 · 떼로 나오는 짐승(한 마리 노출은 드묾)
"B3|CR-097 왕쥐 (시궁쥐 우두머리)(강 · Lv7 · HP 160 · DR 0)": 무리와 함께 나오는 우두머리 · 무리 절반 · 우두머리 죽음이면 흩어지는 규칙(조율사)
"B3|CR-105 사나운 들개(중 · Lv4 · HP 60 · DR 0)": 목표에서 25% 안 · 무리로 나옴(근접 토큰 둘)
"B3|CR-106 들개 우두머리(강 · Lv7 · HP 150 · DR 0)": 무리와 함께 나오는 우두머리(조율사)
"B3|CR-107 경비견 (약탈자·새벽인력 사육견)(중 · Lv4 · HP 60 · DR 0)": 목표에서 25% 안 · 사람 무리에 딸린 개
"B3|CR-121 변이 미국가재(약 · Lv4 · HP 60 · DR 10)": 정면 갑각을 피해 옆 · 뒤를 노리는 적 — 부위 PW-D 구현 뒤(1-13 D-380) 정면 3.9초 · 뒤 약 3.1초. 느린 집게(1:1 18.8초 · 한 방 7%)라 스트레스가 낮고 돌아 들어가는 보람이 설계 의도
"B4|CR-121 변이 미국가재 1명 ↔ Lv4 HP 230 DR 4": 목표에서 25% 안 · 느린 집게(PW-D 구현 뒤 그대로 — 1-13 D-380)
"B3|CR-130 변이 메기(중 · Lv8 · HP 180 · DR 0)": 목표에서 25% 안 · 물을 못 벗어나는 적(물가에서 물러나면 끝난다) · 1막엔 새끼(lv4)만
"B3|CR-200 야생 구울(약 · Lv3 · HP 25 · DR 0)": 떼 성향(최대 넷) — 한 마리는 빨리 쓰러져야 한다
"B3|CR-204 대피민 구울 (지하철 대피소 군집)(약 · Lv3 · HP 25 · DR 0)": 떼 성향(최대 넷)
"B3|CR-205 역무원 구울(중 · Lv5 · HP 60 · DR 5)": 목표에서 25% 안 · 사람 식 + 랭크 폭(조율사)
"B3|CR-305 파수-3 (SJ-G70)(약 · Lv3 · HP 75 · DR 5)": 로봇 · 등 억제기 · 충격 권총(로봇 +50%)이라는 공략이 있는 '단단한 약'(조율사)
"B3|CR-306 역무 파수-3 (SJ-G70 지하철형)(약 · Lv3 · HP 75 · DR 5)": 파수-3과 같은 까닭
"B3|CR-313 두뇌-4 (SJ-G74 관제 중계 로봇)(중 · Lv8 · HP 150 · DR 15)": 2막 이후 적 — 전기 충격 공격 · 무기 배정을 2막 몫에서(D-381)
"B4|CR-313 두뇌-4 (SJ-G74 관제 중계 로봇) 3명 ↔ Lv8 HP 270 DR 18": 2막 이후 적 — 지금은 10mm 판정(전기 충격 8 미구현, D-381)
"B4|CR-402 인도 분대원 3명 ↔ Lv8 HP 270 DR 18": 주인공에게 비살상 · 생포 사격 설계(SD-14 §9.2.1) — test_enemy_arms가 지킨다
"B3|CR-403 계엄 분대장 (중사·하사)(중 · Lv12 · HP 125 · DR 22)": 2막 이후 적 — 레이저 · 플라스마 소총 배정을 2막 몫에서(D-381)
"B4|CR-403 계엄 분대장 (중사·하사) 3명 ↔ Lv12 HP 310 DR 18": 2막 이후 적 — 진행기 계엄군은 '다듬어 둔 장비'(10mm) · 배정은 D-381
"B3|CR-421 약탈자(총)(중 · Lv4 · HP 55 · DR 8)": 목표에서 25% 안 · 사람 식 그대로
"B4|CR-421 약탈자(총) 3명 ↔ Lv4 HP 230 DR 4": 목표에서 25% 안 · 길 위 무리는 사기가 꺾여 흩어진다(1-9e)
"B3|CR-435 새벽인력 모집원(약 · Lv4 · HP 60 · DR 5)": 목표에서 25% 안 · 사람 식 + 랭크 폭(조율사)
"B3|CR-460 각성회 신도(약 · Lv4 · HP 55 · DR 5)": CR-435와 같은 까닭 — 정본 HP 55 · DR 5 그대로(사람 식 20+Lv×8), 먼저 덤비지 않고 털기 · 공격 때만 싸운다(1-13e 조율사)
"B4|CR-438 새벽인력 반장 3명 ↔ Lv13 HP 320 DR 28": 반장은 무리에 하나(셋이 함께 나오지 않는다) · 1막엔 진행기가 Lv8~10으로 세움
"B4|CR-452 자율방범대원 3명 ↔ Lv8 HP 270 DR 18": 목표 위끝에서 25% 안 · 통과 · 넘김 해법이 있는 길목 무리(FQ-SB-02)
"B3|CR-457 계약 경호 구울(중 · Lv12 · HP 130 · DR 18)": 목표에서 25% 안 · 2막 이후 · 전투 산탄총 근접형
"B3|CR-500 외눈(필드 보스 · Lv6 — 교전 전체: 몸 260 × 0.7 + 호위 · 부화)": 기준 35~60초(SD-11 §10.3 — 사용자 결정) · 계산 추정 29.6초는 페이즈 ①(무리를 먼저 보내고 2층 난간에서 지켜봄) · 울부짖기를 못 넣은 값 — 벤치 실측으로 확인하고 모자라면 국면(호위 · 난간 대기)으로 채운다, HP는 올리지 않음(D-380)
"B3|CR-534 독사(강 · Lv10 · HP 140 · DR 12)": 목표에서 25% 안 · 이름 있는 NPC 기본값(SD-14 §10.4) · 1막 MQ-101은 lv4 + 이름 있는 사람 하한 ×1.6
"B2|UQ-65": 단계마다 25 × 읽은 횟수(최대 3) + 마무리 30 — 실제 합 105 ≥ 정본 80(같은 장면을 되풀이해 도구가 25 한 번만 센다)
"B7|CR-200 야생 구울를 10mm 권총으로(탄 4.6발)": 짐승 · 구울은 부산물 몫 — 0 근처 허용(SD-25 B7)
"B7|CR-104 변이 들개를 10mm 권총으로(탄 6.5발)": 짐승은 부산물 몫 — 들개 고기 I-069 절반(1-13 D-380 오타 고침, 기대 −5.5) · 짐승은 0 근처 허용(SD-25)
"B3|CR-424 약탈자(근접)(중 · Lv4 · HP 60 · DR 8)": "목표에서 25% 안(2.6초 / 3~6) — 사람 식 그대로(CR-421과 같은 까닭: 정본 HP 60 · DR 8을 바꾸지 않는다, 조율사 1-13a3)"
"B4|CR-500 외눈 무리 밤 받은 피해": 밤(20~05시) 무리 +2(SD-14 §11.2)는 일부러 더 위험한 판 — 밤에 굴 30칸 안에 들면 '울부짖음이 겹겹이' 안내가 먼저 뜨고(side_r01 1-13h), 엄태경도 '밤엔 건드리지 마'. 제자리 사격 위쪽 끝이 주의 범위(뒷걸음 벤치는 약 1/3)
"B4|RE-X05 밤 사냥 들개 받은 피해": 관악 밤 교체 무리(SD-14 §11.2 '들개 무리 +2' · 우두머리 60%)는 R01에서 가장 위험한 길 위 판 — 흔적 '울부짖음'이 먼저 들려 피할 수 있고, 우두머리는 Lv5부터 · 1-13h부터 큰 몸 · 인식표로 한눈에 보여 먼저 잡으면 무리 50%가 흩어진다(셈은 표적을 아무렇게나 고르는 제자리 위쪽 끝 — 우두머리를 먼저 잡으면 조율사 셈 58~59% / 97~100%)
"B4|RE-006 국회 왕개미 판 3 받은 피해": 병정 하나가 이 판 위협의 전부 — 병정을 먼저 잡으면 일개미뿐 · 비적대 판도 있다(조율사 1-13h)
"B4|RE-006 국회 왕개미 판 2 받은 피해": Lv8 편성 +1 구간의 값 — 1막 끝 레벨에서 왕개미 일개미 넷 · 병정 하나(국회 표시 보상이 따른다)
"B4|RE-008 지하상가 쥐 판 2 받은 피해": 왕쥐가 판의 위협이고 찍찍 울음이 먼저 들린다 · 영등포시장역을 발견하는 보상(조율사 1-13h)
"B4|CR-105 사나운 들개 3명 ↔ Lv4 HP 230 DR 4": 물고 빠지기 ×1.5(SD-14 §4.2 '한 번에 1~2마리씩 물러 들어온다', 1-13h)를 넣은 값 — 길 위 무리는 수로 무섭게 하고 1:1은 길게 끌지 않는다(조율사)
"B4|CR-107 경비견 (약탈자·새벽인력 사육견) 3명 ↔ Lv4 HP 230 DR 4": 사나운 들개와 같은 물기 · 같은 물고 빠지기(1-13h) — 주인을 부르는 짖음이 위협의 몫(조율사)
