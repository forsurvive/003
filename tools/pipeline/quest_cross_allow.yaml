"X1 MQ-101 C-015 언급": MQ-101_S2 '백구가 데려왔다고?'는 지난 일(MQ101_DOG 2 — 산에서 데려온 사실)이라 그 뒤에 죽어도 참. GATE · B-01_BED는 장면 안에서 생사를 본다
"X1 MQ-101 C-021 언급": B-01_BED(밤 전 — 독사는 밤 단계 40 전엔 어느 맵에도 없어 죽을 수 없다) · R1(장면 안 dead("C-021") 갈래) · SELL(결과 5 = 독사와 거래, 살아 있다)
"X1 MQ-102~105 C-006 언급": MQ-104 공문철 · 대장 뒷장의 '시공 입회 영신통신 마영식'(종이의 글씨) — 죽은 뒤에도 참
