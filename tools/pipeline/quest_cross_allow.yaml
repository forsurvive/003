# 퀘스트 교차 정합 표(quest_cross.py)의 허용 목록 — 키: 이유. 키는 보고서의 '종류 키'(예: "X1 MQ-101 N-R01-030").
# 허용은 '검토했고 지금 그대로가 맞다'는 뜻이다. 이유 없이 넣지 않는다. 퀘스트를 고치면 다시 돌려 새 경고를 모두 풀거나 여기에 이유를 적는다.
# 엔진 안전망(1-X): 죽은 인물은 연출 무대에 서지 않고(EventRunner._show_actor) · 죽은 화자의 줄은 건너뛰며(DialogueRunner) · 맵에 다시 서지 않는다.
# 아래 '줄 생략 안전망'은 그 화자가 죽으면 그 한 줄만 빠지고 장면이 말이 된다는 뜻(읽어 보고 판정).

# ---- X1 사람 ----------------------------------------------------------------------------------------------------
"X1 CAPTURE N-R02-039": 줄 생략 안전망 — 우리 안 127번의 귀띔 한 줄. 없으면 우리 장면은 SYS 줄과 선택지(수갑 · 철사)만으로 이어진다
"X1 JUNGGYE N-GS-3": 무명 정비 당번(N-GS-3) — 이름 없는 인물. 줄 생략 안전망
"X1 JUNGGYE C-014 언급": 은솔이 '류정과 갈라섰다'를 말하는 선택지 — 류정 살해가 알려지면 각성회 영구 적대(지도자, Crimes.LEADERS)라 은솔이 말을 섞지 않는다. 알려지기 전에는 모르는 것이 맞다
"X1 MQ-101 N-R01-030": mq101.gd 아침 바크 사전(맵 인물 머리 위) — 죽은 맵 인물은 서지 않으니 바크도 없다
"X1 MQ-101 N-R01-031": 같은 이유(아침 바크 사전)
"X1 MQ-101 N-R01-033": 밤 방어 감시조 DEFENDERS — 세우기 전에 st.is_dead(d[0])로 거른다(변수 인자라 표가 못 본다) + 아침 바크
"X1 MQ-101 N-R01-035": 같은 이유(DEFENDERS · 바크)
"X1 MQ-101 N-R01-036": 같은 이유(DEFENDERS · 바크)
"X1 MQ-101 N-R01-039 언급": 게시판 빗물 당번표의 서명 '남건희' — 죽기 전에 쓴 글씨(물건)라 죽은 뒤에도 참
"X1 MQ-102~105 C-021": SB_ROLE(본소 맵 인물 → 적 전환) — 전환 전에 st.is_dead(nid)로 거른다 · 독사 사망은 st.kill 한 곳
"X1 MQ-102~105 C-049": 같은 이유(SB_ROLE)
"X1 MQ-102~105 N-R02-013": 지하시장 경비 전환 — 살아 있는 맵 인물만(is_instance_valid) 바꾼다
"X1 MQ-102~105 N-R02-036": 같은 이유(SB_ROLE)
"X1 MQ-102~105 N-R02-037": 같은 이유(SB_ROLE)
"X1 MQ-102~105 N-R02-038": 같은 이유(SB_ROLE)
"X1 MQ-102~105 N-R02-017 언급": 배전실 천장으로 몰래 들어온 장면에서 마영식이 견습생 공하경을 부른다 — 같은 방 인물이라 공하경이 죽었다면 마영식도 그 살인을 본 것(지하시장 적대, 장면이 열리지 않는다)
"X1 MQ-106 N-R11-005": 청계산 귀빈실 남궁서현 — 구금(무기 압수) 중 장면, 줄 생략 안전망. 2막 이후 귀빈실 재방문은 1-12에서 다시 본다
"X1 SADANG N-R01-040 언급": 위강윤이 공동 장부 담당 연보경을 언급 — 같은 역 안 사람, 죽음이 알려지면 사당은 원한/적대(Crimes). 알려지기 전엔 모르는 게 맞다. 장부 담당 대체는 1-12 비표시(사당 묶음)에서
