# ---- X2 한 사람 두 곳 ------------------------------------------------------------------------------------------
"X2 C-021 X-BC X-SB": X-BC는 MQ101_NIGHT 2(밤 — 단계 40), X-SB는 MQ101_STAGE ≥ 50(아침 뒤) — 진행 순서상 함께 오지 않는다(표는 변수 사이 관계를 모른다)

# ---- X3 사실 ---------------------------------------------------------------------------------------------------
"X3 MQ-106 MQ104_DOYUN": SD-20 A5 — 106 무전 순간 하도윤을 호송차에서 버티버드로 옮겨 싣는 같은 사실(한 변수)
"X3 TRAVEL SQ_S01_EOM": 엄태경(순회 사냥꾼)에게 S01 바위굴 결과를 알렸다는 S01의 사실 — 그 대화가 TRAVEL 원고에 있을 뿐(P1 한 변수)
"X3 쓰기만 MQ101_ROOF": 옥상길을 들었다는 기록(해법 2의 길은 늘 열려 있다) — 봇 · 저장 확인용
"X3 쓰기만 MQ104_LAST": 관리자의 마지막 쪽지를 읽은 기록 — 봇이 확인한다. 3막 기록 8건 판정(SD-03a §4.4)에서 읽는다(이월)
"X3 쓰기만 MQ104_VENT": 환풍구 경로 기록 — 3막 MQ-302 재진입 판(이월)
"X3 쓰기만 MQ106_SEIZED": 귀빈실 압수 여부 — 봇이 확인, 2막 압수품 되찾기(1-12 RQ)에서 읽는다
"X3 쓰기만 SQ_S02_NH_DEAD": 남건희 죽음의 정본은 st.dead(1-X) — 저장 호환용으로 남긴 옛 표시
"X3 쓰기만 SQ_S02_STOP_DAY": 타이름 날 — 14일 뒤 옥탑 감시조 +1(MQ-507 방어 인원, 5막)에서 읽는다(이월)
"X3 쓰기만 SQ_S04_PD_LOCK": 거점 '관악산 송신소' 공백 고정 — 판도 체계(1-12)에서 읽는다(이월)

# ---- X4 · X5 -----------------------------------------------------------------------------------------------------
"X4 M-205": 프롤로그 진행기의 개발용 시작점(--from=gate)이 주는 것 — 실제 플레이는 MQ-P4 원고 한 곳
"X5 B-01": 거처(HOME_BC)는 MQ-101 완료(100) 뒤에만 장면을 연다(HomeBc.check · _safe) — MQ-101 진행 중 이장실과 겹치지 않는다
