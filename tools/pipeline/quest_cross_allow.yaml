"X1 SADANG N-R01-041 언급": 방송 앰프 옆 허순자 글씨 쪽지(물건) — 죽은 뒤에도 그 쪽지는 남는다
"X1 SQ-S02 N-R01-039 언급": EXAMINE_M301은 척후 지도 글씨 대조(물건 — 당번표 서명) · SQS02_NIGHT는 진행기가 남건희를 살아 있을 때만 세운다(side_s02.gd `not st.is_dead("N-R01-039")`)
