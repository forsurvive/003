"X1 MQ-101 N-R01-026": mq101.gd 아침 바크 사전 · 봇 계획표 — 죽은 맵 인물은 서지 않으니 바크도 없다
"X1 MQ-101 N-R01-029": 같은 이유(아침 바크 사전)
"X1 MQ-102~105 N-R02-035": SB_ROLE(본소 맵 인물 → 적 전환) — 전환 전에 st.is_dead(nid)로 거른다
"X1 MQ-102~105 N-R02-040": _sb_hide_npc(구출한 88번을 우리에서 치움) — 이미 없는 사람을 치우는 것은 아무 일도 하지 않는다
