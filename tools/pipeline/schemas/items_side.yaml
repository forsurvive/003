# SD-13 §7.10 사이드·세력·비표시 퀘스트 아이템 → game/data/items_side.json (단계 1-11b: SQ-S02 패거리 척후 지도부터)
doc: 13_items.md
id_column: ID
section: "### 7.10 사이드·세력·비표시 퀘스트 아이템 (M-301~M-399)"
rows: all
id_filter: "^M-\\d{3}$"
columns:
  ID: {field: id, type: id, pattern: "^M-\\d{3}$", required: true}
  이름: {field: name, type: str, required: true}
  퀘스트(문서): {field: quest, type: str}
  입수: {field: source, type: str}
  용도: {field: desc, type: str}
  태그: {field: kind, type: str}
derive:
  cat: "'misc'"
  weight: "num_in(' '.join([str(quest), str(source), str(desc)]), '무게 ', 0)"   # §7.10: 퀘스트 아이템은 무게 0 — 표에 '무게 n'을 적은 행만 그 값(M-319 · M-383 · M-424 · M-426 등, 1-12e)
  value: "num_in(str(desc), '가치 ', 0) if str(kind) == '잡화' else 0"   # 1-12g: 태그 '잡화' 행(M-428 사진 · M-429 짐 꾸러미)만 '가치 n' — 팔 수 있다
  tag: "'잡화' if str(kind) == '잡화' else '퀘스트'"
gaps:
  desc: {skip_none: true, default: "{'M-301': '구겨진 종이에 연필로 그린 지도. 봉천 물탱크 여섯 개, 옥탑 감시조 교대 시간 22시 · 04시, 윗문 쪽문 자물쇠 \"고장\"이 적혀 있다.', 'M-303': '크레용으로 꾹꾹 눌러 쓴 편지. 삐뚤빼뚤한 로봇 그림 옆에 \"고마워요. 나는 등록 안 됐대도 괜찮아요.\" 읽을 때마다 말이 조금 부드럽게 나온다.'}.get(id)", why: "§7.10 '용도' 열은 기획 메모라 핍-보이 설명으로 쓰지 않는다 — 1-11b에서 쓰는 물건부터 게임 속 문장"}
