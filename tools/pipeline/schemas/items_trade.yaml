  value: "{'M-050': 80, 'M-051': 40, 'M-052': 30, 'M-053': 10, 'M-054': 80, 'M-055': 20, 'M-056': 40, 'M-058': 8, 'M-059': 20, 'M-060': 5, 'M-061': 10, 'M-062': 60, 'M-063': 50}.get(id, 10)"
  desc: "{'M-050': '2077년 이전에 찍힌 책. 표지는 바랬어도 활자는 살아 있다. 용산 요새 기록관이 권마다 캡을 쳐 준다.', 'M-051': '관제망 로봇 몸통에서 떼어 낸 식별 태그. 일련번호와 배치 중계소가 찍혀 있다. 연합단 병기창은 사고, 각성회 성소는 돌려받는다.', 'M-052': '계엄군 인식표. 이름 · 혈액형 · 소속 중대. 연합단 병기창이 산다 — 판 사실이 퍼지면 비상정부가 안다.', 'M-053': '충성 등급이 찍힌 2077년 주민등록증. 각성회는 명부에 올리고, 비상정부는 등급을 복원한다.', 'M-054': '전쟁 전 필름 사진기. 셔터는 아직 떨어진다. 남산 방송 송미래가 서울 기록 사업에 쓴다.', 'M-055': '전쟁 전 필름 한 통. 포장이 뜯기지 않았다. 사진기와 함께 남산 방송에.', 'M-056': '변종 혈액 샘플. 유리관이 미지근하다. 연합단 의무실이 연구용으로 산다.', 'M-058': '2077년 문제집. 답이 연필로 반쯤 적혀 있다. 봉천 계단 학교 아이들의 교재가 된다.', 'M-059': '봉제 인형. 한쪽 눈 단추가 없다. 뚝섬 장터 물새 집 아이들에게.', 'M-060': '자율방범대 포상 증표. 성수 방범 본부 접수계가 세어 준다.', 'M-061': '철벽경호 청부 계약 증표. 강남 지사 연락소에서 셈한다.', 'M-062': '비상정부 주민등록증을 흉내 낸 위조품. 판독기에 대면 한 번은 통과한다 — 들여다보는 사람만 없다면. 지하시장 희정 인쇄 작품.', 'M-063': '볼트 분양권. 세이프빌 관리사무소 수집가가 장당 캡을 친다.'}.get(id, reward)"
